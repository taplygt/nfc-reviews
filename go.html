<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirigiendo...</title>
</head>
<body>

<p>Redirigiendo...</p>

<script>
  const parametros = new URLSearchParams(window.location.search);

  const placa = parametros.get("placa");
  const tipo = parametros.get("tipo") || "NFC";

  const registro =
  "https://script.google.com/macros/s/AKfycbx-74uPUjvChuEmO8lr_5ZFBsSBuhXInbXsuIznBdwW2haMBIYD_uLra5UMDpFWN82h/exec"
  + "?placa=" + encodeURIComponent(placa)
  + "&tipo=" + encodeURIComponent(tipo);

  if (!placa) {
    document.body.innerHTML = "<p>Falta el número de placa</p>";
  } else {
    fetch("clientes.json")
      .then(response => response.json())
      .then(clientes => {
        const cliente = clientes[placa];

        if (!cliente) {
          document.body.innerHTML = "<p>Cliente no encontrado</p>";
          return;
        }
fetch(registro, {
  mode: "no-cors",
  keepalive: true
});

        console.log("Registrando:", registro);

        setTimeout(() => {
          window.location.href = cliente.destino;
        }, 2000);
      })
      .catch(error => {
        console.error("Error:", error);
        document.body.innerHTML = "<p>Error cargando configuración</p>";
      });
  }
</script>

</body>
</html>
