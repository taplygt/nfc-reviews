<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirigiendo...</title>
</head>

<body>
  <p>Redirigiendo...</p>

  <script>
    const parametros = new URLSearchParams(window.location.search);

    const placa = parametros.get("placa");
    const tipo = parametros.get("tipo") || "NFC";

    const webApp =
      "https://script.google.com/macros/s/AKfycbx-74uPUjvChuEmO8lr_5ZFBsSBuhXInbXsuIznBdwW2haMBIYD_uLra5UMDpFWN82h/exec";

    function recibirCliente(datos) {
      if (!datos || !datos.url) {
        document.body.innerHTML = "<p>Cliente no encontrado</p>";
        return;
      }

      window.location.replace(datos.url);
    }

    if (!placa) {
      document.body.innerHTML = "<p>Falta el número de placa</p>";
    } else {
      const script = document.createElement("script");

      script.src =
        webApp +
        "?placa=" + encodeURIComponent(placa) +
        "&tipo=" + encodeURIComponent(tipo) +
        "&callback=recibirCliente" +
        "&v=" + Date.now();

      script.onerror = function () {
        document.body.innerHTML = "<p>Error conectando con el sistema</p>";
      };

      document.body.appendChild(script);
    }
  </script>
</body>
</html>
