<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirigiendo...</title>
</head>

<body>
  <p>Redirigiendo...</p>

  <script>
    const parametros = new URLSearchParams(window.location.search);

    const placa = parametros.get("placa");
    const tipo = parametros.get("tipo") || "NFC";

    const webApp =
      "https://script.google.com/macros/s/AKfycbx-74uPUjvChuEmO8lr_5ZFBsSBuhXInbXsuIznBdwW2haMBIYD_uLra5UMDpFWN82h/exec";

    if (!placa) {
      document.body.innerHTML = "<p>Falta el número de placa</p>";
    } else {
      const destino =
        webApp +
        "?placa=" + encodeURIComponent(placa) +
        "&tipo=" + encodeURIComponent(tipo);

      window.location.replace(destino);
    }
  </script>
</body>
</html>
