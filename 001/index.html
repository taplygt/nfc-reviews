<body>

  <p>Redirigiendo...</p>

 <script>
  const placa = "001";

  const parametros = new URLSearchParams(window.location.search);
  const tipo = parametros.get("tipo") || "NFC";

  const registro =
    "https://script.google.com/macros/s/AKfycbx-74uPUjvChuEmO8lr_5ZFBsSBuhXInbXsuIznBdwW2haMBIYD_uLra5UMDpFWN82h/exec"
    + "?placa=" + encodeURIComponent(placa)
    + "&tipo=" + encodeURIComponent(tipo);

  const googleReviews =
    "https://search.google.com/local/writereview?placeid=ChIJZQ8BcA4LiYURME1ByoI3DkI";

  fetch(registro, {
    mode: "no-cors",
    keepalive: true
  });

  setTimeout(() => {
    window.location.href = googleReviews;
  }, 1000);
</script>
